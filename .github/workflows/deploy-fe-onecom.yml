name: Deploy frontend to One.com

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and deploy FE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Debug build output
        run: |
          echo "Current folder:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Dist folder:"
          ls -la dist || echo "No dist folder found"

          echo ""
          echo "Files inside dist:"
          find dist -maxdepth 3 -type f || echo "No files found in dist"

          echo ""
          echo "Check index.html:"
          test -f dist/index.html

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to One.com via SFTP
        env:
          SFTP_HOST: ${{ secrets.ONE_SFTP_HOST }}
          SFTP_USER: ${{ secrets.ONE_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.ONE_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.ONE_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.ONE_REMOTE_DIR }}
        run: |
          set -e

          echo "Remote dir from GitHub secret:"
          echo "$REMOTE_DIR"

          echo ""
          echo "Checking local dist folder before deploy:"
          ls -la dist
          find dist -maxdepth 3 -type f

          echo ""
          echo "Starting SFTP deploy..."

          lftp -d -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 2

          echo "Connected to SFTP"
          pwd

          echo "Listing current remote root:"
          ls

          echo "Trying to enter remote deploy directory:"
          cd "$REMOTE_DIR"
          pwd

          echo "Listing remote deploy directory before upload:"
          ls

          echo "Starting mirror upload from dist/ to remote directory..."
          mirror --reverse --verbose dist/ .

          echo "Listing remote deploy directory after upload:"
          ls

          bye
          EOF