name: Deploy frontend to One.com

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy FE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la
          ls -la dist
          test -f dist/index.html

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to One.com via SFTP
        env:
          SFTP_HOST: ${{ secrets.ONE_SFTP_HOST }}
          SFTP_USER: ${{ secrets.ONE_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.ONE_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.ONE_SFTP_PORT }}
          REMOTE_DIR: ${{ secrets.ONE_REMOTE_DIR }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p "$SFTP_PORT" "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set ssl:verify-certificate no
          cd "$REMOTE_DIR"
          mirror --reverse --verbose dist/ .
          bye
          EOF